<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f543c" />
      <stop offset="55%" stop-color="#07281d" />
      <stop offset="100%" stop-color="#02100b" />
    </radialGradient>
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6b8" />
      <stop offset="28%" stop-color="#ffd84d" />
      <stop offset="65%" stop-color="#e59b12" />
      <stop offset="100%" stop-color="#8c5300" />
    </linearGradient>
    <linearGradient id="emerald3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28f7b8" />
      <stop offset="50%" stop-color="#0ea875" />
      <stop offset="100%" stop-color="#054d35" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer Luxury Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgRad)" />

  <!-- Outer & Inner Ornate Gold Rings -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#gold3D)" stroke-width="10" />
  <rect x="34" y="34" width="444" height="444" rx="84" fill="none" stroke="#1de9b6" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Subtle Corner Diamonds -->
  <polygon points="256,42 266,54 256,66 246,54" fill="url(#gold3D)" />
  <polygon points="256,446 266,458 256,470 246,458" fill="url(#gold3D)" />
  <polygon points="42,256 54,266 66,256 54,246" fill="url(#gold3D)" />
  <polygon points="446,256 458,266 470,256 458,246" fill="url(#gold3D)" />

  <!-- Royal Casino Crown at Top -->
  <g filter="url(#dropGlow)">
    <path d="M168 158 L194 102 L256 138 L318 102 L344 158 Z" fill="url(#gold3D)" stroke="#fff6b8" stroke-width="3" stroke-linejoin="round" />
    <circle cx="192" cy="94" r="9" fill="#ffd84d" />
    <circle cx="256" cy="82" r="12" fill="#28f7b8" stroke="#ffd84d" stroke-width="3" />
    <circle cx="320" cy="94" r="9" fill="#ffd84d" />
    <rect x="172" y="162" width="168" height="12" rx="6" fill="url(#gold3D)" />
  </g>

  <!-- Central 3D Monogram Shield -->
  <g filter="url(#dropGlow)">
    <!-- Stylized M -->
    <path d="M92 346 L92 198 L142 198 L184 274 L226 198 L276 198 L276 346 L232 346 L232 258 L194 324 L174 324 L136 258 L136 346 Z" fill="url(#gold3D)" stroke="#fff8c8" stroke-width="2" />

    <!-- DynamicIntersecting X in Emerald & Gold -->
    <path d="M294 198 L342 198 L372 248 L402 198 L446 198 L396 272 L450 346 L402 346 L370 296 L338 346 L290 346 L344 272 Z" fill="url(#emerald3D)" stroke="url(#gold3D)" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- Bottom Ribbon Plaque -->
  <g filter="url(#dropGlow)">
    <rect x="108" y="378" width="296" height="52" rx="26" fill="#041912" stroke="url(#gold3D)" stroke-width="4" />
    <text x="256" y="413" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="30" fill="url(#gold3D)" letter-spacing="7">
      MONEYX
    </text>
  </g>
</svg>
